name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Standard GitHub-hosted runners are free and unlimited for this public
# repository. Depot CI remains available as a manual, job-selectable escape
# hatch in `.depot/workflows/ci.yml`.

jobs:
  quality-graph:
    name: quality-graph
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HUSKY: 0
      NODE_OPTIONS: --max-old-space-size=12288
      TURBO_API: ${{ vars.TURBO_API }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_RUN_SUMMARY: "true"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: ./.github/actions/setup-workspace

      - name: Lint
        run: pnpm lint

      - name: Typecheck changed graph
        shell: bash
        run: |
          args=(--concurrency=2)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            args+=(--affected)
          fi
          pnpm typecheck:ci "${args[@]}"

      - name: Record Turbo metrics
        if: always()
        run: node scripts/summarize-turbo-runs.mjs

      - name: Upload Turbo run summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turbo-runs-quality-${{ github.run_attempt }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore
          retention-days: 7

  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HUSKY: 0
      NODE_OPTIONS: --max-old-space-size=12288
      TURBO_API: ${{ vars.TURBO_API }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_RUN_SUMMARY: "true"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: ./.github/actions/setup-workspace

      - name: Test changed graph
        shell: bash
        run: |
          args=(--summarize --output-logs=new-only)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            args+=(--affected)
          fi
          pnpm test "${args[@]}"

      - name: Record Turbo metrics
        if: always()
        run: node scripts/summarize-turbo-runs.mjs

      - name: Upload Turbo run summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turbo-runs-tests-${{ github.run_attempt }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore
          retention-days: 7

  architecture:
    name: architecture
    runs-on: ubuntu-24.04
    # `verify:architecture` has grown from 62 chain links to 102, and two of them
    # drive the real OpenAPI generators. At 10 minutes the job started being
    # CANCELLED rather than failing, which the `checks` and `db-checks`
    # aggregates then render as a red X with no failing step under it — main
    # itself went red that way and read as a flake for two runs.
    timeout-minutes: 25
    env:
      HUSKY: 0
      NODE_OPTIONS: --conditions=development --max-old-space-size=12288
      TURBO_API: ${{ vars.TURBO_API }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: ./.github/actions/setup-workspace

      - name: Architecture checks
        run: pnpm verify:architecture

      - name: i18n checks
        run: pnpm i18n:check

  checks:
    name: checks
    if: always()
    needs:
      - quality-graph
      - tests
      - architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Enforce all quality lanes
        shell: bash
        run: |
          [[ "${{ needs.quality-graph.result }}" == "success" ]]
          [[ "${{ needs.tests.result }}" == "success" ]]
          [[ "${{ needs.architecture.result }}" == "success" ]]

  build-graph:
    name: build-graph
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      HUSKY: 0
      NODE_OPTIONS: --max-old-space-size=12288
      TURBO_API: ${{ vars.TURBO_API }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_RUN_SUMMARY: "true"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: ./.github/actions/setup-workspace

      - name: Build
        run: pnpm turbo build --concurrency=2 --summarize --output-logs=new-only

      - name: Record Turbo metrics
        if: always()
        run: node scripts/summarize-turbo-runs.mjs

      - name: Upload Turbo run summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turbo-runs-build-graph-${{ github.run_attempt }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore
          retention-days: 7

  packaged-acceptance:
    name: packaged-acceptance
    needs: build-graph
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      HUSKY: 0
      NODE_OPTIONS: --max-old-space-size=12288
      TEST_DATABASE_URL: postgresql://voyant:voyant@localhost:5432/voyant_starter_acceptance
      TURBO_API: ${{ vars.TURBO_API }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: voyant
          POSTGRES_PASSWORD: voyant
          POSTGRES_DB: voyant_starter_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voyant -d voyant_starter_acceptance"
          --health-interval 1s
          --health-timeout 1s
          --health-retries 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: ./.github/actions/setup-workspace

      - name: Install acceptance browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Restore build graph
        run: pnpm turbo build --concurrency=2 --output-logs=new-only

      - name: Packaged starter production and development acceptance
        run: |
          acceptance_deploy="$(mktemp -d)"
          pnpm --filter=operator deploy --prod --legacy "$acceptance_deploy"
          node scripts/apply-publish-config.mjs "$acceptance_deploy"
          ln -s "$acceptance_deploy/node_modules" apps/operator/dist/node_modules
          node scripts/measure-operator-application.mjs --require-build --check
          node --test scripts/tests/minimal-starter-acceptance.test.mjs
          node --test scripts/tests/operator-admin-shell-browser.test.mjs

  package-artifacts:
    name: package-artifacts
    needs: build-graph
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      HUSKY: 0
      NODE_OPTIONS: --max-old-space-size=12288
      TURBO_API: ${{ vars.TURBO_API }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: ./.github/actions/setup-workspace

      - name: Restore build graph
        run: pnpm turbo build --concurrency=2 --output-logs=new-only

      - name: Verify package exports
        run: pnpm verify:package-exports

      - name: Verify publish tarballs
        env:
          VOYANT_PACK_REUSE_DIST: "1"
        run: pnpm verify:publish-tarballs

  build:
    name: build
    if: always()
    needs:
      - build-graph
      - packaged-acceptance
      - package-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Enforce build and package lanes
        shell: bash
        run: |
          [[ "${{ needs.build-graph.result }}" == "success" ]]
          [[ "${{ needs.packaged-acceptance.result }}" == "success" ]]
          [[ "${{ needs.package-artifacts.result }}" == "success" ]]

  db-lanes:
    name: db-${{ matrix.lane }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: replay
            runner: ubuntu-24.04
            postgres_image: postgres:16
          # PostgreSQL 18 catalogues a named constraint per NOT NULL column, so
          # it is the only version on which the replay oracle can see that class
          # of name drift at all (voyant#4148).
          - lane: replay-pg18
            runner: ubuntu-24.04
            postgres_image: postgres:18
          - lane: union
            runner: ubuntu-24.04
            postgres_image: postgres:16
          - lane: integration
            runner: ubuntu-24.04
            postgres_image: postgres:16
    runs-on: ${{ matrix.runner }}
    # The integration lane runs each listed file as its own vitest process and
    # takes 11-13 minutes on main, so a 15-minute cap left it with no headroom:
    # a runner ~30% slower than usual cancels it mid-suite, and every file added
    # to the lane brings that closer. Raised to 20 so the cap stays a backstop
    # against a hang rather than a budget the lane is already spending.
    #
    # Raised again to 30 for the same reason, with the arithmetic spelled out so
    # the next person does not have to rediscover it: the lane now names 58
    # files, each paying its own process start and database setup, and the
    # insurance work (voyant#4750, voyant#4756) added four. At 20 it was being
    # cancelled mid-suite with every test passing — a budget, not a backstop.
    # If this needs raising a third time, the answer is probably to stop giving
    # each file its own process rather than to add another ten minutes.
    timeout-minutes: 30
    env:
      HUSKY: 0
      NODE_OPTIONS: --conditions=development --max-old-space-size=12288
      TURBO_API: ${{ vars.TURBO_API }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/voyant_test
      DATABASE_URL: postgresql://test:test@localhost:5432/voyant_test
    services:
      test-db:
        image: ${{ matrix.postgres_image }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: voyant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d voyant_test"
          --health-interval 1s
          --health-timeout 1s
          --health-retries 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          filter: blob:none

      - uses: ./.github/actions/setup-workspace

      - name: Run ${{ matrix.lane }} database lane
        shell: bash
        run: |
          case "${{ matrix.lane }}" in
            replay | replay-pg18)
              node scripts/verify-migration-replay-parity.mjs
              ;;
            union)
              node scripts/migrations/verify-package-baseline.mjs --union
              ;;
            integration)
              NODE_OPTIONS="--conditions=development --import=tsx --max-old-space-size=8192" \
                pnpm --filter operator db:migrate
              pnpm --filter @voyant-travel/relationships exec vitest run \
                tests/integration/generic-custom-field-values.test.ts
              pnpm --filter @voyant-travel/relationships exec vitest run \
                tests/integration/organization-created-command.test.ts
              pnpm --filter @voyant-travel/relationships exec vitest run \
                tests/integration/person-created-command.test.ts
              pnpm --filter @voyant-travel/framework-migrations exec vitest run \
                src/deployment-runner.test.ts
              pnpm --filter @voyant-travel/catalog exec vitest run \
                tests/integration/postgres-indexer.test.ts
              pnpm --filter @voyant-travel/catalog exec vitest run \
                tests/integration/postgres-pgtrgm-indexer.test.ts
              pnpm --filter @voyant-travel/catalog exec vitest run \
                tests/integration/booking-sessions-v1.test.ts
              pnpm --filter @voyant-travel/commerce exec vitest run \
                tests/integration/promotion-created-command.test.ts
              pnpm --filter @voyant-travel/commerce exec vitest run \
                tests/integration/linked-payment-contract-confirmation.test.ts
              pnpm --filter @voyant-travel/commerce exec vitest run \
                tests/integration/fx-rate-capture.test.ts
              pnpm --filter @voyant-travel/commerce exec vitest run \
                tests/integration/ancillary-checkout-fulfilment.test.ts
              pnpm --filter @voyant-travel/commerce exec vitest run \
                tests/integration/checkout-finalization-store.test.ts
              pnpm --filter @voyant-travel/cruises exec vitest run \
                tests/integration/created-target-tools.test.ts
              pnpm --filter @voyant-travel/auth exec vitest run \
                tests/integration/public-api-channel.test.ts
              pnpm --filter @voyant-travel/distribution exec vitest run \
                tests/integration/routes.channel-presets.test.ts
              pnpm --filter @voyant-travel/distribution exec vitest run \
                tests/integration/direct-channel-migration.test.ts
              pnpm --filter @voyant-travel/distribution exec vitest run \
                tests/integration/routes.direct-channel.test.ts
              pnpm --filter @voyant-travel/inventory exec vitest run \
                tests/integration/conservative-family-backfill.test.ts
              pnpm --filter @voyant-travel/inventory exec vitest run \
                tests/integration/mcp-lookup.test.ts
              pnpm --filter @voyant-travel/inventory exec vitest run \
                tests/integration/catalog-plane-pricing-occupancy.test.ts
              pnpm --filter @voyant-travel/finance exec vitest run \
                tests/integration/booking-session-payment.test.ts
              pnpm --filter @voyant-travel/finance exec vitest run \
                tests/integration/payment-adapter-initiation.test.ts
              pnpm --filter @voyant-travel/finance exec vitest run \
                tests/integration/booking-create.test.ts
              pnpm --filter @voyant-travel/finance exec vitest run \
                tests/integration/profitability.test.ts
              pnpm --filter @voyant-travel/finance exec vitest run \
                tests/integration/payment-disputes.test.ts
              pnpm --filter @voyant-travel/finance exec vitest run \
                tests/integration/refund-settlements.test.ts
              pnpm --filter @voyant-travel/finance exec vitest run \
                tests/integration/invoice-document-fulfilment.test.ts
              pnpm --filter @voyant-travel/finance exec vitest run \
                tests/integration/unperformed-services-report.test.ts
              pnpm --filter @voyant-travel/finance exec vitest run \
                tests/integration/public-routes.test.ts
              pnpm --filter @voyant-travel/finance exec vitest run \
                tests/integration/payment-reconciliation-job.test.ts
              pnpm --filter @voyant-travel/bookings exec vitest run \
                tests/integration/booking-amendments.test.ts
              pnpm --filter @voyant-travel/bookings exec vitest run \
                tests/integration/frozen-supplier-statuses.test.ts
              pnpm --filter @voyant-travel/bookings exec vitest run \
                tests/integration/mcp-lookup.test.ts
              pnpm --filter @voyant-travel/bookings exec vitest run \
                tests/integration/booking-documents.test.ts
              pnpm --filter @voyant-travel/bookings exec vitest run \
                tests/integration/fx-rollup.test.ts
              pnpm --filter @voyant-travel/operations exec vitest run \
                tests/availability/integration/auto-allocate-concurrency.test.ts
              pnpm --filter @voyant-travel/operations exec vitest run \
                tests/availability/integration/allocation-assignment-concurrency.test.ts
              pnpm --filter @voyant-travel/operations exec vitest run \
                tests/availability/integration/allocation-routes.test.ts
              pnpm --filter @voyant-travel/operations exec vitest run \
                tests/availability/integration/allocation-departure-resources.test.ts
              pnpm --filter @voyant-travel/operations exec vitest run \
                tests/availability/integration/materialize-template-defaults.test.ts
              pnpm --filter @voyant-travel/operations exec vitest run \
                tests/availability/integration/departure-service-operations.test.ts
              pnpm --filter @voyant-travel/operations exec vitest run \
                tests/availability/integration/departure-summary.test.ts
              pnpm --filter @voyant-travel/operations exec vitest run \
                tests/availability/integration/experience-families-tracer.test.ts
              pnpm --filter @voyant-travel/operations exec vitest run \
                tests/availability/integration/allocation-audit-atomicity.test.ts
              pnpm --filter @voyant-travel/operations exec vitest run \
                tests/availability/integration/rooming-constraints.test.ts
              pnpm --filter @voyant-travel/operations exec vitest run \
                tests/availability/integration/rooming-room-block.test.ts
              pnpm --filter @voyant-travel/legal exec vitest run \
                tests/integration/contract-lifecycle-command.test.ts
              pnpm --filter @voyant-travel/legal exec vitest run \
                tests/integration/booking-contract-confirmed.test.ts
              pnpm --filter @voyant-travel/legal exec vitest run \
                tests/integration/admin-booking-contract-lifecycle.test.ts
              pnpm --filter @voyant-travel/legal exec vitest run \
                tests/integration/insurer-disclosure-terms.test.ts
              pnpm --filter @voyant-travel/insurance exec vitest run \
                tests/integration/durable-issue-command.test.ts
              pnpm --filter @voyant-travel/insurance exec vitest run \
                tests/integration/ancillary-source-fulfilment.test.ts
              pnpm --filter @voyant-travel/db exec vitest run \
                tests/integration/outbox.test.ts
              pnpm --filter @voyant-travel/notifications exec vitest run \
                tests/integration/durable-send.test.ts
              pnpm --filter @voyant-travel/notifications exec vitest run \
                tests/integration/booking-product-template-context.test.ts
              pnpm --filter @voyant-travel/trips exec vitest run \
                tests/integration/durable-sourcing.test.ts
              pnpm --filter @voyant-travel/flights exec vitest run \
                tests/integration/durable-action-command.test.ts
              pnpm --filter @voyant-travel/auth exec vitest run \
                tests/integration/local-public-api.test.ts
              ;;
          esac

  db-checks:
    name: db-checks
    if: always()
    needs: db-lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Enforce all database lanes
        run: test "${{ needs.db-lanes.result }}" = "success"

  operator-image-impact:
    name: operator-image-impact
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      required: ${{ steps.impact.outputs.required }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Verify operator image publication contract
        run: node scripts/check-operator-image-publication.mjs

      - name: Determine whether operator image acceptance is required
        id: impact
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # workflow_dispatch has no comparison SHA and is explicitly asking for
          # CI, so retain the complete image acceptance lane for that event.
          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "Operator image acceptance required: no comparison SHA is available."
            exit 0
          fi

          # Source-only package changes are intentionally handled by the build
          # graph and packaged operator acceptance. Container-specific inputs,
          # dependency manifests, migrations, and operator composition changes
          # retain the full Docker migration/boot/API acceptance below.
          changed_paths="$(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA")"
          if grep -Eq '^(\.dockerignore|\.npmrc|\.github/workflows/(ci|operator-image)\.yml|apps/operator/.*|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json|patches/.*|packages/.+/package\.json|packages/framework-migrations/.*|packages/.+/migrations/.*|scripts/(apply-publish-config|assert-migration-report|check-operator-image-publication|generate-operator-application-manifest|generate-operator-application-metadata|package-operator-admin-shell|resolve-upgrade-baseline|run-generated-migrations|verify-operator-image-identity|verify-operator-admin-shell)\.mjs|scripts/checks/image/release-health\.json|scripts/lib/operator-image-acceptance\.sh|scripts/(smoke|upgrade)-operator-image\.sh)$' <<< "$changed_paths"; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "Operator image acceptance required by an image-impacting change."
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "Operator image acceptance skipped: packaged acceptance covers these changes."
          fi

  operator-image-smoke:
    name: operator-image-smoke
    needs: operator-image-impact
    if: needs.operator-image-impact.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: voyant
          POSTGRES_PASSWORD: voyant
          POSTGRES_DB: voyant_starter_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voyant -d voyant_starter_acceptance"
          --health-interval 1s
          --health-timeout 1s
          --health-retries 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Build production operator image
        run: docker build -f apps/operator/Dockerfile -t voyant-operator:ci .

      - name: Migrate, boot, and smoke-test the production image
        run: scripts/smoke-operator-image.sh voyant-operator:ci

      # The break this catches is a source change, so the branch is where it is
      # cheapest to catch. The published-image lanes repeat it against the
      # digest that actually ships.
      - name: Accept the upgrade path from the previous release
        run: scripts/upgrade-operator-image.sh voyant-operator:ci
