name: Operator image

on:
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".npmrc"
      - ".github/workflows/operator-image.yml"
      - "apps/operator/**"
      - "package.json"
      - "packages/**"
      - "patches/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/apply-publish-config.mjs"
      - "scripts/assert-migration-report.mjs"
      - "scripts/checks/image/release-health.json"
      - "scripts/generate-operator-application-manifest.mjs"
      - "scripts/generate-operator-application-metadata.mjs"
      - "scripts/lib/operator-image-acceptance.sh"
      - "scripts/package-operator-admin-shell.mjs"
      - "scripts/resolve-upgrade-baseline.mjs"
      - "scripts/run-generated-migrations.mjs"
      - "scripts/smoke-operator-image.sh"
      - "scripts/upgrade-operator-image.sh"
      - "scripts/verify-operator-image-identity.mjs"
      - "scripts/verify-operator-admin-shell.mjs"
      - "turbo.json"
  workflow_dispatch:
    inputs:
      operation:
        description: "Publish an immutable release image or explicitly promote a release to latest"
        required: true
        type: choice
        options:
          - publish-release
          - promote-latest
      release_version:
        description: "Semver release tag, for example 0.225.0"
        required: true
        type: string

concurrency:
  group: operator-image-${{ inputs.operation == 'promote-latest' && 'promote-latest' || format('{0}-{1}-{2}', github.ref, inputs.operation, inputs.release_version) }}
  cancel-in-progress: false

# Keep the workflow default read-only. Registry and attestation privileges are
# granted only to jobs that can be reached by main pushes or an explicit
# workflow dispatch; pull requests never invoke this workflow.
permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/voyant-travel/operator
  # buildx's own default for the docker-container driver. Naming it here lets the
  # build job pre-pull the exact reference the builder will boot.
  BUILDKIT_IMAGE: moby/buildkit:buildx-stable-1

jobs:
  plan:
    name: publication-plan
    if: github.event_name == 'push' || inputs.operation == 'publish-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.publication.outputs.digest }}
      exists: ${{ steps.publication.outputs.exists }}
      tag: ${{ steps.publication.outputs.tag }}
      version: ${{ steps.publication.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          filter: blob:none

      # This job only reads the registry through `docker buildx imagetools`,
      # which addresses it directly and never dispatches a build. The default
      # driver installs the buildx CLI without booting a BuildKit container, so
      # the job no longer depends on Docker Hub being reachable to do work that
      # never touches it.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate publication and preserve immutable tags
        id: publication
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Release images must be dispatched from main."
              exit 1
            fi
            if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || (( ${#RELEASE_VERSION} > 120 )); then
              echo "release_version must be semver without a leading v or build metadata."
              exit 1
            fi
            version="$RELEASE_VERSION"
          else
            version="sha-$GITHUB_SHA"
          fi

          tag="$IMAGE_NAME:$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if existing=$(docker buildx imagetools inspect "$tag" 2>/dev/null); then
            digest=$(awk '$1 == "Digest:" { print $2; exit }' <<<"$existing")
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Could not resolve the existing digest for $tag."
              exit 1
            fi
            if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$RUN_ATTEMPT" == "1" ]]; then
              echo "Immutable release tag $tag already exists at $digest."
              exit 1
            fi
            node scripts/verify-operator-image-identity.mjs \
              "$IMAGE_NAME" "$IMAGE_NAME@$digest" "$GITHUB_SHA" "$version"
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "Release recovery attempt $RUN_ATTEMPT found $tag at $digest; re-verifying it without overwriting."
            else
              echo "Automatic SHA publication is already present at $digest; verifying it again."
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build-and-smoke-${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.exists != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: voyant
          POSTGRES_PASSWORD: voyant
          POSTGRES_DB: voyant_starter_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voyant -d voyant_starter_acceptance"
          --health-interval 1s
          --health-timeout 1s
          --health-retries 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none

      # This is the only job that needs a real builder, so it is the only one
      # that boots the docker-container driver — and booting it pulls BuildKit
      # from Docker Hub. A single 502 there failed the arm64 build before a line
      # of the image existed, which failed the whole publication
      # (https://github.com/voyant-travel/voyant/actions/runs/32034681045).
      # buildx tolerates a failed pull when the image is already in the local
      # store, so warm it here with retries and pin the driver to the exact
      # reference that was warmed.
      - name: Warm the BuildKit driver image
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5; do
            if docker pull "$BUILDKIT_IMAGE"; then
              exit 0
            fi
            delay=$(( attempt * 5 ))
            echo "Pull of $BUILDKIT_IMAGE failed (attempt $attempt); retrying in ${delay}s."
            sleep "$delay"
          done
          echo "::warning::Could not pre-pull $BUILDKIT_IMAGE; letting the builder boot pull it."

      # Each job runs on the same architecture it builds. Do not add QEMU: the
      # production deploy tree contains architecture-specific native modules.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push native platform image by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/operator/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_VERSION=${{ needs.plan.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
          cache-from: type=gha,scope=operator-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=operator-image-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

      - name: Record the immutable platform digest
        id: platform
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Native $ARCH build did not produce a valid OCI digest: $DIGEST"
            exit 1
          fi
          mkdir -p /tmp/operator-image-digests
          touch "/tmp/operator-image-digests/$ARCH-${DIGEST#sha256:}"
          echo "ref=$IMAGE_NAME@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "$ARCH -> $IMAGE_NAME@$DIGEST"

      - name: Migrate, boot, and API-smoke the native platform digest
        run: scripts/smoke-operator-image.sh "${{ steps.platform.outputs.ref }}"

      - name: Extract the byte-identical admin shell companion
        if: matrix.arch == 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          container=$(docker create "${{ steps.platform.outputs.ref }}")
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          mkdir -p /tmp/operator-admin-shell
          docker cp "$container:/app/admin-shell/." /tmp/operator-admin-shell/
          node scripts/verify-operator-admin-shell.mjs /tmp/operator-admin-shell

      - name: Publish the admin shell companion artifact
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operator-admin-shell-${{ needs.plan.outputs.version }}
          path: /tmp/operator-admin-shell
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Upload the platform digest receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operator-image-digest-${{ matrix.arch }}
          path: /tmp/operator-image-digests/*
          if-no-files-found: error
          retention-days: 1

  finalize:
    name: finalize-and-verify
    needs:
      - plan
      - build
    if: ${{ always() && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: voyant
          POSTGRES_PASSWORD: voyant
          POSTGRES_DB: voyant_starter_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voyant -d voyant_starter_acceptance"
          --health-interval 1s
          --health-timeout 1s
          --health-retries 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          filter: blob:none

      # Manifest assembly is `imagetools` all the way down; no builder required.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download native platform digest receipts
        if: needs.plan.outputs.exists != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: operator-image-digest-*
          path: /tmp/operator-image-digests
          merge-multiple: true

      - name: Create the canonical multi-platform image
        if: needs.plan.outputs.exists != 'true'
        shell: bash
        env:
          FINAL_TAG: ${{ needs.plan.outputs.tag }}
          IMAGE_VERSION: ${{ needs.plan.outputs.version }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          if existing=$(docker buildx imagetools inspect "$FINAL_TAG" 2>/dev/null); then
            digest=$(awk '$1 == "Digest:" { print $2; exit }' <<<"$existing")
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Could not resolve the canonical digest for $FINAL_TAG."
              exit 1
            fi
            if [[ "$RUN_ATTEMPT" == "1" ]]; then
              echo "Canonical tag $FINAL_TAG appeared after publication planning at $digest; refusing to overwrite it."
              exit 1
            fi
            node scripts/verify-operator-image-identity.mjs \
              "$IMAGE_NAME" "$IMAGE_NAME@$digest" "$GITHUB_SHA" "$IMAGE_VERSION"
            echo "Recovery attempt $RUN_ATTEMPT adopted $FINAL_TAG at $digest without overwriting it."
            exit 0
          fi

          sources=()
          for arch in amd64 arm64; do
            mapfile -t receipts < <(find /tmp/operator-image-digests -maxdepth 1 -type f -name "$arch-*" -print)
            if (( ${#receipts[@]} != 1 )); then
              echo "Expected exactly one $arch digest receipt, found ${#receipts[@]}."
              exit 1
            fi
            digest=${receipts[0]##*"$arch-"}
            if ! [[ "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Invalid $arch digest receipt: $digest"
              exit 1
            fi
            sources+=("$IMAGE_NAME@sha256:$digest")
          done

          docker buildx imagetools create --tag "$FINAL_TAG" "${sources[@]}"

      - name: Resolve and verify the exact canonical digest
        id: image
        shell: bash
        env:
          EXISTING_DIGEST: ${{ needs.plan.outputs.digest }}
          FINAL_TAG: ${{ needs.plan.outputs.tag }}
          IMAGE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          manifest=$(docker buildx imagetools inspect "$FINAL_TAG")
          digest=$(awk '$1 == "Digest:" { print $2; exit }' <<<"$manifest")
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Publication did not produce a valid OCI digest: $digest"
            exit 1
          fi
          if [[ -n "$EXISTING_DIGEST" && "$digest" != "$EXISTING_DIGEST" ]]; then
            echo "Immutable tag drift: planned $EXISTING_DIGEST but resolved $digest."
            exit 1
          fi

          node scripts/verify-operator-image-identity.mjs \
            "$IMAGE_NAME" "$IMAGE_NAME@$digest" "$GITHUB_SHA" "$IMAGE_VERSION"

          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "ref=$IMAGE_NAME@$digest" >> "$GITHUB_OUTPUT"
          echo "Published $FINAL_TAG as $IMAGE_NAME@$digest"

      - name: Attest the canonical multi-platform image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Migrate, boot, and API-smoke the canonical digest
        run: scripts/smoke-operator-image.sh "${{ steps.image.outputs.ref }}"

      # The defect class this catches — ledger identity, baseline adoption,
      # re-entrancy — is architecture-independent, so it runs once here against
      # the canonical digest rather than twice in the per-arch build matrix.
      - name: Accept the upgrade path from the previous release
        run: |
          scripts/upgrade-operator-image.sh \
            "${{ steps.image.outputs.ref }}" "${{ needs.plan.outputs.version }}"

      - name: Verify anonymous access to the public base digest
        run: |
          set -euo pipefail
          docker logout ghcr.io
          docker buildx imagetools inspect "${{ steps.image.outputs.ref }}" --raw >/dev/null

  promote-latest:
    name: promote-latest-and-verify
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'promote-latest'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: voyant
          POSTGRES_PASSWORD: voyant
          POSTGRES_DB: voyant_starter_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voyant -d voyant_starter_acceptance"
          --health-interval 1s
          --health-timeout 1s
          --health-retries 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          filter: blob:none

      # Promotion only moves a tag with `imagetools`; no builder required.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and validate the immutable release
        id: release
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "latest must be promoted from main."
            exit 1
          fi
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || (( ${#RELEASE_VERSION} > 120 )); then
            echo "release_version must be semver without a leading v or build metadata."
            exit 1
          fi
          release_ref="$IMAGE_NAME:$RELEASE_VERSION"
          manifest=$(docker buildx imagetools inspect "$release_ref")
          digest=$(awk '$1 == "Digest:" { print $2; exit }' <<<"$manifest")
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve $release_ref to an OCI digest."
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "ref=$IMAGE_NAME@$digest" >> "$GITHUB_OUTPUT"

      - name: Migrate, boot, and API-smoke the release digest
        run: scripts/smoke-operator-image.sh "${{ steps.release.outputs.ref }}"

      # A release that cannot migrate an existing deployment must not become the
      # tag consumers reach for first. 0.6.0 passed this job's fresh-database
      # acceptance and was promoted anyway.
      - name: Accept the release's upgrade path from its predecessor
        run: |
          scripts/upgrade-operator-image.sh \
            "${{ steps.release.outputs.ref }}" "${{ inputs.release_version }}"

      - name: Explicitly promote the verified release to latest
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:latest" \
            "${{ steps.release.outputs.ref }}"
          manifest=$(docker buildx imagetools inspect "$IMAGE_NAME:latest")
          latest_digest=$(awk '$1 == "Digest:" { print $2; exit }' <<<"$manifest")
          test "$latest_digest" = "${{ steps.release.outputs.digest }}"
          echo "$IMAGE_NAME:latest -> $latest_digest"
